
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAS DERMAGA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#172033}
header{background:#123b67;color:white;padding:24px 20px;border-radius:0 0 24px 24px}
header h2{margin:0 0 6px}
header p{margin:0;color:#cbdcf0;font-size:13px}
main{max-width:850px;margin:auto;padding:18px}
.balance{background:linear-gradient(135deg,#145a91,#102f55);color:white;padding:23px;border-radius:18px;margin-bottom:16px}
.balance small{color:#c9e1f5}
.balance h1{font-size:32px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.card{background:white;border-radius:14px;padding:16px;box-shadow:0 2px 8px #00000009}
.card small{color:#64748b}
.card h3{margin:9px 0 0;font-size:18px}
.green{color:#15803d}.red{color:#dc2626}
h3.section{font-size:17px;margin:22px 0 12px}
form{background:white;padding:17px;border-radius:16px}
label{display:block;font-size:13px;margin:12px 0 6px;font-weight:bold}
input,select{width:100%;padding:12px;border:1px solid #d5dce5;border-radius:9px;font-size:15px;background:white}
button{border:0;border-radius:9px;padding:12px 15px;font-size:14px;font-weight:bold;cursor:pointer}
.submit{background:#145a91;color:white;width:100%;margin-top:17px}
.tools{display:flex;gap:8px;margin:12px 0}
.tools button{background:#dceafa;color:#123b67}
table{width:100%;border-collapse:collapse;background:white;font-size:13px}
th,td{padding:12px 8px;text-align:left;border-bottom:1px solid #e5eaf0}
th{background:#eaf1f8}
.history{overflow-x:auto;border-radius:12px}
.del{background:#fee2e2;color:#b91c1c;padding:7px}
footer{text-align:center;color:#64748b;font-size:12px;padding:25px}
@media(max-width:480px){main{padding:13px}.balance h1{font-size:27px}th,td{font-size:12px;padding:10px 6px}}
</style>
</head>
<body>
<header>
<h2>⚓ KAS DERMAGA</h2>
<p>Sistem Pengelolaan Keuangan Dermaga</p>
</header>
<main>
<div class="balance">
<small>TOTAL SALDO KESELURUHAN</small>
<h1 id="saldo">Rp0</h1>
<small id="tanggal"></small>
</div>

<div class="grid">
<div class="card"><small>Total Pemasukan</small><h3 class="green" id="masuk">Rp0</h3></div>
<div class="card"><small>Total Pengeluaran</small><h3 class="red" id="keluar">Rp0</h3></div>
<div class="card"><small>Saldo Kas Dermaga</small><h3 id="kas">Rp0</h3></div>
<div class="card"><small>Dana Asuransi</small><h3 id="asuransi">Rp0</h3></div>
</div>

<h3 class="section">＋ Catat Transaksi</h3>
<form id="form">
<label>Jenis Transaksi</label>
<select id="jenis">
<option value="masuk">Uang Masuk</option>
<option value="keluar">Uang Keluar</option>
</select>

<label>Pos Keuangan</label>
<select id="kategori">
<option value="Kas Dermaga">Kas Dermaga</option>
<option value="Penyewaan Sampan">Penyewaan Sampan</option>
<option value="Dana Asuransi">Dana Asuransi</option>
</select>

<label>Tanggal</label>
<input type="date" id="tgl" required>

<label>Keterangan</label>
<input type="text" id="ket" placeholder="Contoh: Pembayaran sewa sampan" required>

<label>Jumlah Uang (Rp)</label>
<input type="number" id="jumlah" min="1" placeholder="Masukkan jumlah" required>

<button class="submit" type="submit">SIMPAN TRANSAKSI</button>
</form>

<h3 class="section">Riwayat Transaksi</h3>
<div class="tools">
<button onclick="exportCSV()">Unduh Laporan CSV</button>
<button onclick="cetak()">Cetak</button>
</div>
<div class="history">
<table>
<thead><tr><th>Tanggal</th><th>Keterangan</th><th>Pos</th><th>Jumlah</th><th>Aksi</th></tr></thead>
<tbody id="riwayat"></tbody>
</table>
</div>
</main>
<footer>KAS DERMAGA · Pengelolaan Keuangan</footer>

<script>
let data=JSON.parse(localStorage.getItem("kasDermaga")||"[]");
const rupiah=n=>"Rp"+Number(n).toLocaleString("id-ID");
const el=id=>document.getElementById(id);

el("tgl").value=new Date().toISOString().slice(0,10);
el("tanggal").textContent=new Date().toLocaleDateString("id-ID",{dateStyle:"full"});

function simpan(){
 localStorage.setItem("kasDermaga",JSON.stringify(data));
 tampil();
}

function tampil(){
 let masuk=0,keluar=0,kas=0,asuransi=0;
 data.forEach(d=>{
  let nilai=d.jenis==="masuk"?Number(d.jumlah):-Number(d.jumlah);
  if(d.jenis==="masuk")masuk+=Number(d.jumlah);
  else keluar+=Number(d.jumlah);
  if(d.kategori==="Dana Asuransi")asuransi+=nilai;
  else kas+=nilai;
 });
 el("saldo").textContent=rupiah(masuk-keluar);
 el("masuk").textContent=rupiah(masuk);
 el("keluar").textContent=rupiah(keluar);
 el("kas").textContent=rupiah(kas);
 el("asuransi").textContent=rupiah(asuransi);

 el("riwayat").innerHTML=data.slice().reverse().map((d,i)=>`
 <tr>
 <td>${d.tgl}</td>
 <td>${aman(d.ket)}</td>
 <td>${aman(d.kategori)}</td>
 <td>${rupiah(d.jumlah)}</td>
 <td><button class="del" onclick="hapus(${data.length-1-i})">Hapus</button></td>
 </tr>`).join("")||'<tr><td colspan="5">Belum ada transaksi</td></tr>';
}
function aman(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
el("form").addEventListener("submit",e=>{
 e.preventDefault();
 data.push({
  jenis:el("jenis").value,
  kategori:el("kategori").value,
  tgl:el("tgl").value,
  ket:el("ket").value,
  jumlah:Number(el("jumlah").value)
 });
 simpan();
 el("form").reset();
 el("tgl").value=new Date().toISOString().slice(0,10);
 alert("Transaksi berhasil disimpan");
});
function hapus(i){
 if(confirm("Hapus transaksi ini?")){
  data.splice(i,1);
  simpan();
 }
}
function exportCSV(){
 let rows=[["Tanggal","Jenis","Kategori","Keterangan","Jumlah"],
 ...data.map(d=>[d.tgl,d.jenis,d.kategori,d.ket,d.jumlah])];
 let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
 let a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv"}));
 a.download="laporan-kas-dermaga.csv";
 a.click();
 URL.revokeObjectURL(a.href);
}
function cetak(){window.print()}
tampil();
</script>
</body>
</html>
